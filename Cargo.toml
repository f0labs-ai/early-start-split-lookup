[workspace]
resolver = "3"
members = [
    "crates/early-start",
    "crates/onebit",
    "crates/ctxstab",
    "crates/split-lookup",
    "crates/measure",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Suvendu Mohanty"]
repository = "https://github.com/f0labs-ai/early-start-split-lookup"
publish = false

[workspace.dependencies]
early-start = { path = "crates/early-start" }
onebit = { path = "crates/onebit" }
ctxstab = { path = "crates/ctxstab" }
split-lookup = { path = "crates/split-lookup" }

anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
futures-util = "0.3.34"
hound = "3.5.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
